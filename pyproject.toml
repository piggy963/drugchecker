# Tool settings only. Dependencies are in requirements.txt (exact versions, generated by Agent Studio).

[tool.pyright]
pythonVersion = "3.10"
include = ["agent", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# Vercel's Python runtime serves this FastAPI application at the project root.
[tool.vercel]
entrypoint = "agent.server:app"
